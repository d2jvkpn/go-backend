---
apiVersion: v1
kind: Service
metadata:
  namespace: dev
  name: go-backend
spec:
  type: ClusterIP # LoadBalancer, NodePort
  # clusterIP: 10.107.98.176
  selector: { app: "go-backend" }
  ports:
  - { name: http, protocol: TCP, port: 9011, targetPort: 9011 }
  - { name: rpc, protocol: TCP, port: 9021, targetPort: 9021 }
#  ports:
#  ## nodePort port range: 30000-32767
#  ## port: communcation between nodes, targetPort: pod port, nodePort: service node port
#  - { name: http, protocol: TCP, port: 9011, targetPort: 9011, nodePort: 30032 }
#  - { name: grpc, protocol: TCP, port: 9021, targetPort: 9021, nodePort: 30042 }

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: dev
  name: go-backend
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /
    ingress.kubernetes.io/limit-connections: "1024"
    nginx.ingress.kubernetes.io/limit-rps: "256"
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/proxy-body-size: 8m
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/ingress.class: "nginx"
    # nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    # nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
  - host: go-backend.k8s-dev.local
    http:
      paths:
      - pathType: Prefix
        path: /
        backend: { service: { name: http, port: { number: 9011 } } }
      - pathType: ImplementationSpecific
        path: /
        backend: { service: { name: grpc, port: { number: 9021 } } }

---
## Horizontal Pod Autoscaler, https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale-walkthrough/
# kubectl autoscale deployment php-apache --cpu-percent=50 --min=2 --max=10
# kubectl get hpa
# kubectl run -i --tty load-generator --rm --image=busybox:1.28 --restart=Never -- /bin/sh -c "while sleep 0.01; do wget -q -O- http://php-apache; done"
# kubectl get hpa php-apache --watch
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  namespace: dev
  name: go-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: go-backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
