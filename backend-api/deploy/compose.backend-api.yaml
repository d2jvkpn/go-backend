networks:
  net: { name: "fullstack-vue-go", driver: bridge, external: true }

services:
  api:
    image: ${IMAGE_Name}:${IMAGE_Tag}
    restart: always
    #labels: { autoheal: true } # work with willfarrell/autoheal
    #healthcheck:
      #test: ["CMD", "curl", "-fI", "--connect-timeout", "2", "http://localhost:9011/healthz"]
      #start_period: 3s
      #interval: 10s
      #timeout: 2s
      #retries: 3
    #network_mode: host
    networks: ["net"]
    ports: ["127.0.0.1:${HTTP_Port}:${HTTP_Port}", "127.0.0.1:9019:9019", "127.0.0.1:9020:9020"]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 2048M }
        #limits: { cpus: "4", memory: 8g }
        #reservations:
          #cpus: "1"
          #memory: 4g
          #devices:
          #- driver: nvidia
          #  device_ids: ['0', '3']
          #  count: 1
          #  count: all
          #  capabilities: [gpu]
    user: "${USER_UID}:${USER_GID}"
    container_name: ${APP_Name}-api
    environment:
      TZ: Asia/Shanghai
    working_dir: /opt
    volumes:
    - ./configs/:/opt/configs:ro
    - ./logs/:/opt/logs
    - ./site/:/opt/site
    - ./data/:/opt/data
    # - ./data/${APP_Name}:/opt/data
    command:
    - ./target/main
    - api
    - -release
    - -config=configs/prod.yaml
    - -http.addr=:${HTTP_Port}

  crons:
    image: ${IMAGE_Name}:${IMAGE_Tag}
    restart: always
    depends_on: ["postgres", "redis"]
    #network_mode: host
    networks: ["net"]
    user: "${USER_UID}:${USER_GID}"
    container_name: ${APP_Name}-crons
    environment:
      TZ: Asia/Shanghai
    working_dir: /opt
    volumes:
    - ./configs/:/opt/configs:ro
    - ./logs/:/opt/logs
    command: [./target/${APP_Name}, crons, -config=configs/crons.yaml]

  swagger:
    image: ${IMAGE_Name}:${IMAGE_Tag}
    restart: always
    #network_mode: host
    network_mode: bridge
    ports: ["9017:9017"]
    user: "${USER_UID}:${USER_GID}"
    container_name: ${APP_Name}-swagger
    environment:
      TZ: Asia/Shanghai
    volumes:
    - ./configs/swagger.yaml:/opt/configs/swagger.yaml:ro
    command:
    - ./target/main
    - swagger
    - -config=configs/swagger.yaml
    - -http.addr=:9017
