  /api/v1/auth/account/update_status:
    get:
      consumes:
      - application/json
      description: '...'
      parameters:
      - description: account id(uuid)
        in: query
        name: accountId
        type: string
      - description: |-
          new status
          enum: activated,blocked,deleted
          required: true
        enum:
        - activated
        - blocked
        - deleted
        in: query
        name: newStatus
        type: string
      - description: |-
          origin status
          enum: created,activated,blocked
          required: true
        enum:
        - created
        - activated
        - blocked
        in: query
        name: status
        type: string
