        "200":
          description: OK
          schema:
            $ref: '#/definitions/structs.ResponseOK'
      summary: Account logout
      tags:
      - account::logout
  /api/v1/auth/account/query_accounts:
    get:
      consumes:
      - application/json
      description: '...'
      parameters:
      - description: |-
          minimum: 10
          maximum: 100
          default: 10
        in: query
        maximum: 100
        minimum: 10
        name: pageSize
        type: integer
        x-order: "01"
      - description: 'minimum: 1'
        in: query
        name: pageIndex
        type: integer
        x-order: "02"
      - description: |-
          sort by field
          enum: createdAt,updatedAt,firstname,lastname
          default: createdAt + desc
        enum:
        - createdAt
        - updatedAt
        - firstname
        - lastname
        in: query
        name: sortBy
        type: string
        x-order: "03"
      - description: |-
          enum: asc,desc
          default: asc
        enum:
        - asc
        - desc
        in: query
        name: order
        type: string
        x-order: "04"
      - description: 'maxLen: 32'
        in: query
        maxLength: 32
        name: keyword
        type: string
        x-order: "10"
      - description: |-
          enum: admin,editor,reviewer,user,guest
          default:
        enum:
        - admin
        - editor
        - reviewer
        - user
        - guest
        in: query
        name: level
        type: string
        x-order: "11"
      - description: |-
          enum: created,activated,blocked,deleted
